<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition for Gradients & Shadow effects -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a255c" />
      <stop offset="100%" stop-color="#020e26" />
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="30%" stop-color="#FFAE00" />
      <stop offset="70%" stop-color="#E59400" />
      <stop offset="100%" stop-color="#B26B00" />
    </linearGradient>

    <!-- Drop Shadow for high-contrast visibility at small sizes -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Blue Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ornate Ornament/Jewelry circular pattern -->
  <g filter="url(#dropShadow)" fill="none" stroke="url(#goldGrad)">
    <!-- Decorative Lace / Gold beads border -->
    <circle cx="256" cy="265" r="148" stroke-width="12" />
    <path d="M256,91 A 174 174 0 0 1 430,265 A 174 174 0 0 1 256,439 A 174 174 0 0 1 82,265 A 174 174 0 0 1 256,91" stroke-width="16" stroke-dasharray="1 30" stroke-linecap="round"/>
    <path d="M256,101 A 164 164 0 0 1 420,265 A 164 164 0 0 1 256,429 A 164 164 0 0 1 92,265 A 164 164 0 0 1 256,101" stroke-width="10" stroke-dasharray="24 16" stroke-linecap="round"/>
  </g>

  <!-- Calculator / Math Frame overlapping the circle -->
  <g filter="url(#dropShadow)" fill="url(#goldGrad)">
    <!-- Calculator top border/screen display -->
    <rect x="176" y="145" width="160" height="42" rx="10" />
    <rect x="190" y="157" width="90" height="18" rx="3" fill="#020e26" opacity="0.3"/>
    <rect x="294" y="157" width="12" height="18" rx="2" fill="#020e26" opacity="0.3"/>
    <rect x="312" y="157" width="12" height="18" rx="2" fill="#020e26" opacity="0.3"/>

    <!-- Calculator Grid and Body (The matrix for the keys) -->
    <rect x="192" y="198" width="128" height="142" rx="14" />
    
    <!-- Cutouts of calculator grid keys inside the gold body (using the base BG color) -->
    <g fill="#020e26" opacity="0.2">
      <rect x="208" y="214" width="22" height="22" rx="5" />
      <rect x="245" y="214" width="22" height="22" rx="5" />
      <rect x="282" y="214" width="22" height="22" rx="5" />
      
      <rect x="208" y="248" width="22" height="22" rx="5" />
      <rect x="245" y="248" width="22" height="22" rx="5" />
      <rect x="282" y="248" width="22" height="22" rx="5" />
      
      <rect x="208" y="282" width="22" height="22" rx="5" />
      <rect x="245" y="282" width="22" height="22" rx="5" />
      <rect x="282" y="282" width="22" height="22" rx="5" />

      <rect x="208" y="316" width="59" height="12" rx="3" />
      <rect x="282" y="316" width="22" height="12" rx="3" />
    </g>
  </g>

  <!-- Big Central "%" Making Charge Icon (High prominence for snippets) -->
  <g filter="url(#dropShadow)">
    <!-- Percent sign stroke and circles, carefully placed and sized for clarity -->
    <line x1="210" y1="330" x2="302" y2="200" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="218" cy="226" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="18" />
    <circle cx="294" cy="304" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="18" />
  </g>
  
  <!-- Subtle sparkles to emphasize "gold" quality -->
  <path d="M165,115 L168,125 L178,128 L168,131 L165,141 L162,131 L152,128 L162,125 Z" fill="#FFE79A" />
  <path d="M365,345 L368,355 L378,358 L368,361 L365,371 L362,361 L352,358 L362,355 Z" fill="#FFE79A" />
  <path d="M380,180 L382,186 L388,188 L382,190 L380,196 L378,190 L372,188 L378,186 Z" fill="#FFAE00" />
</svg>
