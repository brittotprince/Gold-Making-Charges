<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Making Charge Calculator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-4 md:p-8 flex justify-center">
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        function CalculatorApp() {
            // Storing state as strings fixes the decimal point cursor bug
            const [totalPrice, setTotalPrice] = React.useState("165000");
            const [weight, setWeight] = React.useState("10");
            const [goldRate, setGoldRate] = React.useState("14270");
            const [gst, setGst] = React.useState("3");

            // Input handler that allows decimals without jumping the cursor
            const handleInput = (setter) => (e) => {
                const value = e.target.value;
                // Regex allows empty string, or numbers with up to one decimal point
                if (value === '' || /^\d*\.?\d*$/.test(value)) {
                    setter(value);
                }
            };

            // Run calculations safely
            const p = parseFloat(totalPrice) || 0;
            const w = parseFloat(weight) || 0;
            const r = parseFloat(goldRate) || 0;
            const g = parseFloat(gst) || 0;

            const goldValue = w * r;
            const basePrice = p / (1 + (g / 100));
            const makingChargeAmt = basePrice - goldValue;
            const makingChargePct = goldValue > 0 ? (makingChargeAmt / goldValue) * 100 : 0;

            // Helper for Indian currency formatting
            const formatRupees = (num) => "₹" + num.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

            return (
                <>
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                    <div class="bg-amber-500 p-6 text-white text-center">
                        <h1 class="text-2xl font-bold">Making Charge Calculator</h1>
                        <p class="text-amber-100 text-sm mt-1">Find out what you're really paying</p>
                    </div>

                    <div class="p-6 space-y-6">
                        {/* Inputs Section */}
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Total Final Price (₹)</label>
                                <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={totalPrice} 
                                    onChange={handleInput(setTotalPrice)}
                                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all"
                                    placeholder="e.g. 165000"
                                />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Weight of Ornament (g)</label>
                                <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={weight} 
                                    onChange={handleInput(setWeight)}
                                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all"
                                    placeholder="e.g. 10.5"
                                />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Local Gold Rate/g (₹)</label>
                                <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={goldRate} 
                                    onChange={handleInput(setGoldRate)}
                                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all"
                                    placeholder="e.g. 14270"
                                />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">GST (%)</label>
                                <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={gst} 
                                    onChange={handleInput(setGst)}
                                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all"
                                    placeholder="e.g. 3"
                                />
                            </div>
                        </div>

                        {/* Results Section */}
                        <div class="mt-8 bg-gray-50 rounded-xl p-5 border border-gray-200">
                            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Breakdown</h2>
                            
                            <div class="space-y-3">
                                <div class="flex justify-between items-center text-gray-600">
                                    <span>Pure Gold Value</span>
                                    <span class="font-medium">{formatRupees(goldValue)}</span>
                                </div>
                                <div class="flex justify-between items-center text-gray-600">
                                    <span>Price Before GST</span>
                                    <span class="font-medium">{formatRupees(basePrice)}</span>
                                </div>
                                
                                <hr class="border-gray-200 my-2" />
                                
                                <div class="flex justify-between items-center">
                                    <span class="text-lg font-semibold text-gray-800">Making Charge (Amount)</span>
                                    <span class="text-lg font-bold text-red-600">{formatRupees(makingChargeAmt)}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-lg font-semibold text-gray-800">Making Charge (%)</span>
                                    <span class="text-lg font-bold text-red-600">
                                        {makingChargePct.toLocaleString('en-IN', { maximumFractionDigits: 2 })}%
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 text-center text-sm text-gray-500">
                    <a href="https://github.com/brittotprince/Gold-Making-Charges" target="_blank" rel="noopener noreferrer" class="hover:text-amber-600 transition-colors underline decoration-dotted">
                        Get the source code here
                    </a>
                </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CalculatorApp />);
    </script>
</body>
</html>
